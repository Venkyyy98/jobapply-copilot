[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobapply-copilot-server"
version = "0.1.0"
description = "Local tailoring engine for JobApply Copilot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.8.0",
  "python-dotenv>=1.0.1",
  "PyYAML>=6.0.2",
  "Jinja2>=3.1.4",
  "openai>=1.40.0",
  "reportlab>=4.2.2",
  "python-docx>=1.1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["fonts/*.ttf", "fonts/LICENSE_LIBERATION"]
