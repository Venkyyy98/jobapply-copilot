<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JobApply Copilot - Options</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="container">
      <h1>JobApply Copilot Settings</h1>

      <section class="card">
        <h2>API Connection</h2>
        <label>API base URL</label>
        <input id="apiBaseUrl" placeholder="https://your-api.example.com" />
        <label>Application tracker URL</label>
        <input id="websiteUrl" type="url" placeholder="https://jobapply-copilot-web.onrender.com/app/jobs" />
        <label>Beta extension token</label>
        <input id="extensionToken" type="password" placeholder="Paste token from web onboarding" />
        <label>Local shared token (development fallback)</label>
        <input id="jacToken" type="password" placeholder="Match JAC_TOKEN in server env" />
        <label>OpenAI API key for AI requests</label>
        <input id="openaiApiKey" type="password" placeholder="sk-... stored for this browser session by default" />
        <label class="checkbox-row">
          <input id="rememberOpenAiKey" type="checkbox" />
          Remember key on this device
        </label>
        <p class="hint">Default is session-only storage via chrome.storage.session. Remembering stores the key in local extension storage on this device only.</p>
        <div class="inline-actions">
          <button id="testOpenAiKeyBtn" type="button">Test API Key</button>
          <button id="removeOpenAiKeyBtn" type="button">Remove API Key</button>
        </div>
      </section>

      <button id="saveBtn">Save Settings</button>
      <p id="status"></p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
